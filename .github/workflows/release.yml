name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (e.g. v1.3.2) or branch/commit to build and release'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Sync version from git tag
        run: |
          REF="${{ github.event.inputs.ref || '' }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_REF#refs/tags/v}"
          fi
          REF="${REF#refs/tags/v}"
          REF="${REF#v}"
          echo "Syncing package.json version to $REF"
          npm version "$REF" --no-git-tag-version --allow-same-version
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentype-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.msi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | **Windows** | `OpenType-Setup-*.exe` |
            | **macOS (Apple Silicon)** | `OpenType-*-arm64.dmg` |
            | **macOS (Intel)** | `OpenType-*.dmg` _(not arm64)_ |
            | **Linux** | `OpenType-*.AppImage` |

            > Other files (`.yml`, `.blockmap`) are used for auto-updates — you can ignore them.

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
