name: Auto Version

on:
  push:
    branches: [main]

concurrency:
  group: auto-version
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Skip if last commit is an auto-release commit
        id: is-release
        run: |
          if git log -1 --format=%s | grep -q "\[skip-release\]"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and commit
        if: steps.is-release.outputs.found != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VER="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          git commit -m "chore: release v${NEW_VER} [skip-release]"
          git push origin HEAD:main

      - name: Create and push version tag
        if: steps.is-release.outputs.found != 'true'
        run: |
          NEW_VER="$(node -p "require('./package.json').version")"
          git tag "v${NEW_VER}"
          git push origin "v${NEW_VER}"